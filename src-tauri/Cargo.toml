[package]
name = "phoenix-tekton"
version = "0.1.1"
edition = "2021"
description = "Phoenix Tekton — service blueprint studio (desktop shell)"
authors = ["Dr. Delminquoe L Cunningham <info@phoenixinceptionsmediallc.com>"]
license = "MIT OR Apache-2.0"

# Why: without this feature the binary compiles in dev mode — no embedded
# frontend, and the webview loads the devUrl (localhost:6041), which only
# answers while `npm run dev` is running. Plain-cargo builds (e.g. cargo-xwin
# cross-compile to Windows) must pass `--features custom-protocol` exactly as
# the tauri CLI does for `npm run tauri build`.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The stock shell: one webview wrapping the editor's static build. The wasm
# engine runs IN the webview — no invoke commands exist yet; the platform
# persistence adapter lands in its own phase (src/platform/persistence.ts
# stays the only seam).
tauri = { version = "2", features = [] }
